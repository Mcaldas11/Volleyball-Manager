# The iPhone and iPad app (mobile/ios), built on GitHub's Macs — an iPhone app can only be built on
# one. See mobile/PUBLICAR_MOBILE.md.
#
# - simulator: on every push to main that changes the game or mobile/, and by hand. Builds the app for
#   the iPhone simulator, runs it on a simulated iPhone and iPad held sideways, and keeps screenshots
#   and the simulator build on the run's page.
# - testflight: by hand (Run workflow, with "testflight" ticked) or on a version tag, once the Apple
#   secrets are set. Builds the real app, signs it and sends it to App Store Connect, for TestFlight
#   and the App Store.

name: iOS builds

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'public/**', 'mobile/**', '.github/workflows/ios.yml', '!**.md']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also sign it and send it to TestFlight (needs the Apple secrets)'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # The game copied in from src/ and built, then put into the iPhone project.
      - run: npm run build
      - run: npx cap sync ios

      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 25

      - name: Run it on a simulated iPhone and iPad
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p shots
          brew install facebook/fb/idb-companion >/dev/null 2>&1 || true
          pip3 install --break-system-packages fb-idb >/dev/null 2>&1 || pip3 install fb-idb >/dev/null 2>&1 || true
          shoot() {
            local kind="$1" name="$2"
            local udid
            udid=$(xcrun simctl list devices available | grep -E "^ +$kind" | head -n1 | grep -oE '[0-9A-F-]{36}')
            if [ -z "$udid" ]; then echo "No $kind simulator"; return; fi
            echo "$name: $(xcrun simctl list devices | grep "$udid" | head -n1)"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b >/dev/null
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" com.miguelcaldas.volleyballmanager
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/$name-1-splash.png"
            # A tap on the splash, then the main menu (idb, if it installed).
            if command -v idb >/dev/null; then
              idb_companion --udid "$udid" >/dev/null 2>&1 &
              sleep 5
              idb connect localhost 10882 >/dev/null 2>&1 || true
              idb ui tap --udid "$udid" 300 200 || true
              sleep 6
              xcrun simctl io "$udid" screenshot "shots/$name-2-menu.png"
              kill %1 2>/dev/null || true
            fi
            xcrun simctl shutdown "$udid"
          }
          shoot "iPhone 16 Pro" iphone
          shoot "iPad Air" ipad

      - name: Pack the simulator build
        if: always()
        run: |
          if [ -d build/Build/Products/Debug-iphonesimulator/App.app ]; then
            cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/mobile/volleyball-manager-ios-simulator.zip" App.app
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            mobile/shots/*.png
            mobile/volleyball-manager-ios-simulator.zip
          if-no-files-found: warn

  testflight:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    needs: simulator
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: The Apple secrets are set
        # Before the checkout: mobile/ isn't there yet.
        working-directory: .
        run: |
          for s in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!s}" ]; then echo "::error::Secret for $s is missing — see mobile/PUBLICAR_MOBILE.md"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Sign and send to App Store Connect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" | tail -n 25
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}" | tail -n 25
          rm -f "$KEY"
          echo "Sent version $VERSION (build $GITHUB_RUN_NUMBER) to App Store Connect."

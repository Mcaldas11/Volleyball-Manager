<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Matthew Lienert, drawn: no photo. Brown curly hair, usually a mess; slim; fair skin with a little tan. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#3d5f8c"/>
      <stop offset="1" stop-color="#132238"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c9a6"/>
      <stop offset="1" stop-color="#e3b18c"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22395c"/>
      <stop offset="1" stop-color="#162741"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- Shoulders: slim, in the club's navy -->
  <path d="M44 256 C50 216 84 200 128 200 C172 200 206 216 212 256 Z" fill="url(#shirt)"/>
  <path d="M60 256 C66 226 92 212 112 208" fill="none" stroke="#2c4870" stroke-width="3" opacity=".7"/>
  <!-- Neck -->
  <path d="M113 160 L113 202 Q128 214 143 202 L143 160 Z" fill="#dcaa86"/>
  <path d="M113 176 Q128 190 143 176 L143 168 Q128 182 113 168 Z" fill="#c8936f" opacity=".45"/>
  <!-- Collar -->
  <path d="M106 201 L128 228 L150 201" fill="none" stroke="#d7a73f" stroke-width="6" stroke-linejoin="round"/>

  <!-- Ears -->
  <ellipse cx="84" cy="132" rx="8.5" ry="13" fill="#e2ae8a"/>
  <ellipse cx="172" cy="132" rx="8.5" ry="13" fill="#e2ae8a"/>
  <path d="M84 125 Q80 132 85 140" fill="none" stroke="#c48c69" stroke-width="2"/>
  <path d="M172 125 Q176 132 171 140" fill="none" stroke="#c48c69" stroke-width="2"/>

  <!-- Face: young and narrow -->
  <path d="M86 110 C86 78 170 78 170 110 L169 138 C166 166 149 184 128 186 C107 184 90 166 87 138 Z" fill="url(#skin)"/>
  <!-- A little shadow under the jaw, a little sun on the cheeks -->
  <path d="M90 150 C96 170 112 182 128 183 C144 182 160 170 166 150 C160 172 145 186 128 186 C111 186 96 172 90 150 Z" fill="#c99470" opacity=".35"/>
  <ellipse cx="104" cy="152" rx="10" ry="6" fill="#e0957a" opacity=".22"/>
  <ellipse cx="152" cy="152" rx="10" ry="6" fill="#e0957a" opacity=".22"/>

  <!-- Hair: brown, curly and messy -->
  <g fill="#3e2615">
    <circle cx="86" cy="100" r="15"/><circle cx="80" cy="116" r="11"/><circle cx="170" cy="100" r="15"/>
    <circle cx="176" cy="116" r="11"/><circle cx="100" cy="72" r="18"/><circle cx="128" cy="64" r="21"/>
    <circle cx="156" cy="72" r="18"/><circle cx="92" cy="84" r="16"/><circle cx="164" cy="84" r="16"/>
    <circle cx="116" cy="80" r="16"/><circle cx="140" cy="80" r="16"/>
    <circle cx="72" cy="96" r="7"/><circle cx="185" cy="92" r="7"/><circle cx="128" cy="43" r="9"/>
    <circle cx="66" cy="108" r="6"/><circle cx="191" cy="105" r="5.5"/><circle cx="152" cy="37" r="7"/><circle cx="104" cy="40" r="5"/>
  </g>
  <g fill="#5b3920">
    <circle cx="97" cy="64" r="14"/><circle cx="116" cy="56" r="14"/><circle cx="139" cy="54" r="14"/>
    <circle cx="160" cy="63" r="14"/><circle cx="176" cy="82" r="11"/><circle cx="80" cy="84" r="11"/>
    <circle cx="106" cy="84" r="12"/><circle cx="128" cy="76" r="13"/><circle cx="151" cy="84" r="12"/>
    <circle cx="146" cy="44" r="8"/><circle cx="108" cy="46" r="7"/>
  </g>
  <!-- The fringe, falling over his forehead -->
  <g fill="#6a4426">
    <circle cx="100" cy="99" r="10"/><circle cx="116" cy="95" r="10"/><circle cx="133" cy="97" r="10"/>
    <circle cx="149" cy="94" r="10"/><circle cx="162" cy="101" r="8.5"/><circle cx="90" cy="106" r="7.5"/>
  </g>
  <g fill="none" stroke="#2c1a0e" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M94 99 a6 6 0 1 1 7 6"/><path d="M111 95 a6 6 0 1 1 8 5"/><path d="M128 97 a6 6 0 1 1 8 5"/>
    <path d="M144 94 a6 6 0 1 1 8 5"/><path d="M92 63 a7 7 0 1 1 9 6"/><path d="M122 74 a7 7 0 1 1 9 6"/>
    <path d="M154 62 a7 7 0 1 1 9 6"/><path d="M134 52 a7 7 0 1 1 9 5"/><path d="M110 55 a6 6 0 1 1 8 5"/>
    <path d="M172 82 a5 5 0 1 1 6 5"/><path d="M76 84 a5 5 0 1 1 6 5"/>
  </g>
  <g fill="#8b5c33" opacity=".85">
    <circle cx="112" cy="50" r="4"/><circle cx="140" cy="48" r="4.5"/><circle cx="95" cy="59" r="3.5"/>
    <circle cx="161" cy="58" r="3.5"/><circle cx="125" cy="71" r="4"/><circle cx="118" cy="91" r="3.5"/>
    <circle cx="147" cy="90" r="3.5"/><circle cx="102" cy="95" r="3"/>
  </g>

  <!-- Brows -->
  <path d="M102 117 Q111 111 121 116" fill="none" stroke="#4e321d" stroke-width="4" stroke-linecap="round"/>
  <path d="M135 116 Q145 111 154 117" fill="none" stroke="#4e321d" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="111" cy="129" rx="8.5" ry="5.5" fill="#fbf6f1"/>
  <ellipse cx="145" cy="129" rx="8.5" ry="5.5" fill="#fbf6f1"/>
  <circle cx="112" cy="129" r="4.3" fill="#6a4a2d"/>
  <circle cx="146" cy="129" r="4.3" fill="#6a4a2d"/>
  <circle cx="112" cy="129" r="2" fill="#1b120b"/>
  <circle cx="146" cy="129" r="2" fill="#1b120b"/>
  <circle cx="113.3" cy="127.6" r="1.2" fill="#fff"/>
  <circle cx="147.3" cy="127.6" r="1.2" fill="#fff"/>
  <path d="M102 127 Q111 121 120 127" fill="none" stroke="#5a3d27" stroke-width="2" stroke-linecap="round"/>
  <path d="M136 127 Q145 121 154 127" fill="none" stroke="#5a3d27" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M129 132 Q125 147 128 151 Q132 153 136 149" fill="none" stroke="#c38a66" stroke-width="3" stroke-linecap="round"/>
  <!-- A half smile -->
  <path d="M115 163 Q129 171 143 162" fill="none" stroke="#a65e4c" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 167 Q129 170 138 166" fill="none" stroke="#d48f7c" stroke-width="2" stroke-linecap="round" opacity=".6"/>
</svg>
